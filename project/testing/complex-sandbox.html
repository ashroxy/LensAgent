<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LensAgent Complex Validation Sandbox</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Custom scrollbar for realism */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #f1f1f1; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans h-screen flex flex-col overflow-hidden">

  <!-- Fixed Header -->
  <header class="bg-indigo-600 text-white p-4 shadow-md z-10 flex justify-between items-center">
    <div class="flex items-center gap-2">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
      <h1 class="text-xl font-bold">SkyLink Travel Portal</h1>
    </div>
    <nav class="flex gap-4">
      <a href="#" class="hover:text-indigo-200">Dashboard</a>
      <a href="#" class="hover:text-indigo-200">Bookings</a>
      <a href="#" class="hover:text-indigo-200">Profile</a>
    </nav>
  </header>

  <!-- Scrollable Main Area -->
  <main class="flex-1 overflow-y-auto p-8 flex gap-8">
    
    <!-- Left Column: Form Controls (Tests A11y Tree & DOM Snapshot) -->
    <section class="flex-1 max-w-xl bg-white p-6 rounded-xl shadow-sm border border-slate-200">
      <h2 class="text-lg font-semibold mb-4 border-b pb-2">Flight Search Criteria</h2>
      
      <div class="grid grid-cols-2 gap-4 mb-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Origin</label>
          <input type="text" id="origin" placeholder="e.g., DEL" class="w-full border-slate-300 rounded-md shadow-sm p-2 border focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Destination</label>
          <input type="text" id="dest" placeholder="e.g., BOM" class="w-full border-slate-300 rounded-md shadow-sm p-2 border focus:ring-2 focus:ring-indigo-500">
        </div>
      </div>

      <div class="mb-4">
        <label class="block text-sm font-medium text-slate-700 mb-1">Travel Class</label>
        <select class="w-full border-slate-300 rounded-md shadow-sm p-2 border focus:ring-2 focus:ring-indigo-500">
          <option value="econ">Economy</option>
          <option value="biz">Business</option>
          <option value="first">First Class</option>
        </select>
      </div>

      <div class="flex items-center gap-2 mb-6">
        <input type="checkbox" id="direct" class="w-4 h-4 text-indigo-600 rounded">
        <label for="direct" class="text-sm text-slate-700">Direct flights only</label>
      </div>

      <div class="flex gap-4">
        <button id="searchBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-6 rounded-md shadow-sm transition-colors">
          Search Flights
        </button>
        <button id="disabledBtn" disabled class="bg-slate-200 text-slate-400 font-medium py-2 px-6 rounded-md cursor-not-allowed">
          Promo Code (Unavailable)
        </button>
      </div>
    </section>

    <!-- Right Column: Canvas & Logs (Tests Visual Perception vs A11y gap) -->
    <section class="flex-1 flex flex-col gap-6">
      
      <!-- Canvas Graph (Invisible to A11y tree, but visible to WebGPU Vision!) -->
      <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
        <h2 class="text-lg font-semibold mb-4 border-b pb-2">Price Trend (Canvas Component)</h2>
        <canvas id="priceChart" width="400" height="150" class="w-full bg-slate-50 border border-slate-100 rounded"></canvas>
        <p class="text-xs text-slate-500 mt-2">Notice: This chart has no DOM elements. Only the Visual Stream (Member 2) will see the peaks.</p>
      </div>

      <!-- Interaction Log (To visually prove CDP injected events) -->
      <div class="bg-slate-900 text-green-400 p-4 rounded-xl shadow-sm font-mono text-xs flex-1 flex flex-col">
        <div class="font-bold text-white mb-2 uppercase tracking-wide border-b border-slate-700 pb-1">CDP Event Logger</div>
        <div id="eventLog" class="overflow-y-auto flex-1 space-y-1">
          <div>[System] Listening for CDP synthetic events...</div>
        </div>
      </div>

    </section>
  </main>

  <script>
    // Draw a fake graph on the canvas
    const ctx = document.getElementById('priceChart').getContext('2d');
    ctx.beginPath();
    ctx.moveTo(0, 100);
    ctx.lineTo(50, 120);
    ctx.lineTo(100, 60);
    ctx.lineTo(150, 80);
    ctx.lineTo(200, 30);
    ctx.lineTo(250, 50);
    ctx.lineTo(300, 10);
    ctx.lineTo(350, 40);
    ctx.lineTo(400, 20);
    ctx.strokeStyle = '#4f46e5';
    ctx.lineWidth = 3;
    ctx.stroke();
    
    // Add glowing dots
    ctx.fillStyle = '#4f46e5';
    [ [100,60], [200,30], [300,10] ].forEach(([x,y]) => {
      ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI*2); ctx.fill();
    });

    // Event Logger Utility
    const log = document.getElementById('eventLog');
    function logEvent(msg, color = 'text-green-400') {
      const el = document.createElement('div');
      el.className = color;
      el.textContent = `[${new Date().toISOString().split('T')[1].slice(0,8)}] ${msg}`;
      log.prepend(el);
    }

    // Track all interactions on the page
    document.addEventListener('click', (e) => {
      logEvent(`CLICK -> Tag: <${e.target.tagName.toLowerCase()}>, Classes: [${e.target.className.split(' ').slice(0,2).join(', ')}]`, 'text-blue-400');
      
      if (e.target.id === 'searchBtn') {
        e.target.textContent = 'Searching...';
        e.target.classList.add('bg-indigo-400');
        setTimeout(() => {
           e.target.textContent = 'Search Flights';
           e.target.classList.remove('bg-indigo-400');
        }, 1000);
      }
    });

    document.addEventListener('keydown', (e) => {
      logEvent(`KEYPRESS -> Key: "${e.key}", Target: <${e.target.tagName.toLowerCase()}>`, 'text-yellow-400');
    });

    document.addEventListener('input', (e) => {
      logEvent(`INPUT -> Value changed to: "${e.target.value}"`, 'text-fuchsia-400');
    });
  </script>
</body>
</html>
